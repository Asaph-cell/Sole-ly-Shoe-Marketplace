<!doctype html>
<html lang="en">

<head>
  <!-- Google tag (gtag.js) — track old domain visits -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MZETPL0C40"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-MZETPL0C40');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0f" />

  <!-- Auto-redirect after 8 seconds -->
  <meta http-equiv="refresh" content="8;url=https://solelymarketplace.com" />

  <!-- SEO: tell search engines we moved -->
  <link rel="canonical" href="https://solelymarketplace.com/" />
  <meta name="robots" content="noindex, follow" />

  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <title>Solely Has Moved → solelymarketplace.com</title>
  <meta name="description"
    content="Solely Kenya has moved to solelymarketplace.com. Visit our new home for Kenya's safest marketplace with escrow-protected payments." />

  <!-- OG: updated for the move -->
  <meta property="og:title" content="Solely Has Moved → solelymarketplace.com" />
  <meta property="og:description"
    content="We've upgraded! Visit solelymarketplace.com for Kenya's safest way to buy & sell with escrow protection." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://solelymarketplace.com/" />

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />

  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #c8b34d;
      --gold-light: #e2d06e;
      --gold-glow: rgba(200, 179, 77, 0.35);
      --bg-dark: #08080d;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f0f0f5;
      --text-secondary: rgba(240, 240, 245, 0.55);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      overflow: hidden;
    }

    /* ── Animated mesh gradient background ── */
    .bg-mesh {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(200, 179, 77, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 60% 80% at 80% 70%, rgba(120, 80, 200, 0.06) 0%, transparent 70%),
        radial-gradient(ellipse 90% 50% at 50% 100%, rgba(200, 179, 77, 0.04) 0%, transparent 60%);
      animation: meshShift 12s ease-in-out infinite alternate;
    }

    @keyframes meshShift {
      0% { opacity: 0.8; transform: scale(1) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.05) rotate(1deg); }
      100% { opacity: 0.8; transform: scale(1) rotate(-1deg); }
    }

    /* ── Floating particles ── */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: var(--gold);
      border-radius: 50%;
      opacity: 0;
      animation: particleFloat linear infinite;
    }

    @keyframes particleFloat {
      0% { opacity: 0; transform: translateY(100vh) scale(0); }
      10% { opacity: 0.6; }
      90% { opacity: 0.3; }
      100% { opacity: 0; transform: translateY(-10vh) scale(1); }
    }

    /* ── Main container ── */
    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      text-align: center;
    }

    /* ── Glass card ── */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      backdrop-filter: blur(40px) saturate(1.3);
      -webkit-backdrop-filter: blur(40px) saturate(1.3);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.03),
        0 24px 80px -12px rgba(0, 0, 0, 0.5),
        0 0 120px -20px var(--gold-glow);
      animation: cardEntry 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardEntry {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.96);
        filter: blur(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    /* ── Logo / wordmark ── */
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
      animation: fadeIn 1s ease 0.3s both;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      overflow: hidden;
    }

    .logo-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .logo-text {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--text-primary), var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Badge ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 100px;
      background: rgba(200, 179, 77, 0.1);
      border: 1px solid rgba(200, 179, 77, 0.2);
      color: var(--gold-light);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
      animation: fadeIn 1s ease 0.5s both;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    /* ── Heading ── */
    .heading {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      animation: fadeIn 1s ease 0.6s both;
    }

    .heading em {
      font-style: normal;
      color: var(--gold);
    }

    /* ── Body text ── */
    .body-text {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-secondary);
      margin-bottom: 32px;
      animation: fadeIn 1s ease 0.7s both;
    }

    .body-text a {
      color: var(--gold-light);
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px solid rgba(200, 179, 77, 0.3);
      transition: border-color 0.2s;
    }

    .body-text a:hover {
      border-color: var(--gold-light);
    }

    /* ── CTA button ── */
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 32px;
      border-radius: 100px;
      background: linear-gradient(135deg, var(--gold), #b8a23e);
      color: #0a0a0f;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 24px -4px var(--gold-glow);
      animation: fadeIn 1s ease 0.8s both;
      position: relative;
      overflow: hidden;
    }

    .cta::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }

    .cta:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 40px -4px var(--gold-glow);
    }

    .cta:hover::before {
      transform: translateX(100%);
    }

    .cta:active {
      transform: translateY(0) scale(0.98);
    }

    .cta-arrow {
      transition: transform 0.3s ease;
    }

    .cta:hover .cta-arrow {
      transform: translateX(4px);
    }

    /* ── Countdown ── */
    .countdown {
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-secondary);
      animation: fadeIn 1s ease 0.9s both;
    }

    .countdown-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 700;
      font-size: 14px;
      color: var(--gold-light);
      margin: 0 4px;
      font-variant-numeric: tabular-nums;
    }

    /* ── Progress bar ── */
    .progress-wrap {
      width: 100%;
      max-width: 200px;
      height: 3px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 100px;
      margin: 16px auto 0;
      overflow: hidden;
      animation: fadeIn 1s ease 1s both;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      border-radius: 100px;
      width: 0%;
      transition: width 1s linear;
    }

    /* ── Footer ── */
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: rgba(240, 240, 245, 0.25);
      animation: fadeIn 1s ease 1.1s both;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .card {
        padding: 36px 24px;
        border-radius: 22px;
      }

      .heading {
        font-size: 24px;
      }

      .body-text {
        font-size: 14px;
      }

      .cta {
        padding: 14px 28px;
        font-size: 14px;
        width: 100%;
        justify-content: center;
      }

      .logo-text {
        font-size: 22px;
      }
    }

    /* ── Reduce motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01s !important;
        transition-duration: 0.01s !important;
      }
    }
  </style>
</head>

<body>
  <!-- Animated background -->
  <div class="bg-mesh"></div>

  <!-- Floating particles -->
  <div class="particles" id="particles"></div>

  <!-- Main content -->
  <div class="container">
    <div class="card">
      <!-- Logo -->
      <div class="logo">
        <div class="logo-icon">
          <img src="/favicon.png" alt="Solely" width="44" height="44" />
        </div>
        <span class="logo-text">Solely</span>
      </div>

      <!-- Badge -->
      <div class="badge">
        <span class="badge-dot"></span>
        New Home
      </div>

      <!-- Heading -->
      <h1 class="heading">
        We've <em>moved</em> to a<br />new home
      </h1>

      <!-- Body -->
      <p class="body-text">
        Solely is now at
        <a href="https://solelymarketplace.com">solelymarketplace.com</a> —
        same escrow protection, more categories, better experience.
      </p>

      <!-- CTA -->
      <a href="https://solelymarketplace.com" class="cta" id="cta-button">
        Go to Solely Marketplace
        <svg class="cta-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
      </a>

      <!-- Countdown -->
      <p class="countdown">
        Redirecting in <span class="countdown-num" id="countdown">8</span> seconds
      </p>

      <!-- Progress bar -->
      <div class="progress-wrap">
        <div class="progress-bar" id="progress"></div>
      </div>
    </div>

    <p class="footer">© 2025 Solely Marketplace</p>
  </div>

  <script>
    // ── Countdown & redirect ──
    (function () {
      var seconds = 8;
      var el = document.getElementById('countdown');
      var bar = document.getElementById('progress');
      var total = seconds;

      // Kick off progress bar
      requestAnimationFrame(function () {
        bar.style.width = '100%';
        bar.style.transition = 'width ' + total + 's linear';
      });

      var timer = setInterval(function () {
        seconds--;
        if (el) el.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(timer);
          window.location.href = 'https://solelymarketplace.com';
        }
      }, 1000);
    })();

    // ── Floating particles ──
    (function () {
      var container = document.getElementById('particles');
      if (!container) return;
      for (var i = 0; i < 20; i++) {
        var p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (8 + Math.random() * 12) + 's';
        p.style.animationDelay = (Math.random() * 8) + 's';
        p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
        container.appendChild(p);
      }
    })();

    // ── Track redirect event in GA ──
    if (typeof gtag === 'function') {
      gtag('event', 'redirect_impression', {
        event_category: 'migration',
        event_label: 'solely_kenya_to_marketplace',
        non_interaction: true
      });
    }
  </script>
</body>

</html>
